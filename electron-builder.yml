# MMH Windows desktop packaging config (electron-builder).
# The standalone Next.js app and the portable Node runtime are staged into
# release-artifacts/win/stage by scripts/build-win-desktop.cjs and shipped as
# extraResources (never packed into asar, because they contain native modules
# and runtime binaries).

appId: com.mmh.desktop
productName: MMH
copyright: Copyright © 2026 MMH

# The standalone server runs on the bundled portable Node (resources/node),
# never on Electron's own runtime, so native modules must NOT be rebuilt for
# Electron. They were already rebuilt for Node 22 ABI during staging.
npmRebuild: false

directories:
  output: release-artifacts/win/dist
  buildResources: release-artifacts/win/build

files:
  - electron/main.cjs
  - electron/preload.cjs
  - "!node_modules/**"
  - "!**/node_modules/**"
  # electron-updater and its runtime deps (the standalone server keeps its
  # own node_modules under extraResources, so only the updater goes into asar).
  - "node_modules/electron-updater/**"
  - "node_modules/builder-util-runtime/**"
  - "node_modules/fs-extra/**"
  - "node_modules/graceful-fs/**"
  - "node_modules/jsonfile/**"
  - "node_modules/universalify/**"
  - "node_modules/js-yaml/**"
  - "node_modules/argparse/**"
  - "node_modules/lazy-val/**"
  - "node_modules/lodash.escaperegexp/**"
  - "node_modules/lodash.isequal/**"
  - "node_modules/semver/**"
  - "node_modules/tiny-typed-emitter/**"
  - "node_modules/debug/**"
  - "node_modules/ms/**"
  - "node_modules/sax/**"

publish:
  # 更新源是我们的下载站，不是 GitHub Release：Release 只放安装包给手动下载，
  # 自动更新走 dl.floatingice.win 上的 latest.yml + blockmap（支持差分下载）。
  provider: generic
  url: https://dl.floatingice.win/

extraResources:
  - from: release-artifacts/win/stage/app
    to: app
    filter:
      - "**/*"
  - from: release-artifacts/win/stage/node
    to: node
    filter:
      - "**/*"
  - from: release-artifacts/win/build/icon.png
    to: icon.png

win:
  icon: release-artifacts/win/build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MMH
  # 公开资产名与更新清单里的文件名必须一致，且只发这一个 exe：
  # `latest.yml` 的 files[].url / path 由 electron-builder 按这里写入，
  # 所以直接用友好名，避免再复制一份别名（曾因此让 Release 出现两个 164MB 的 exe）。
  artifactName: mmh-win-setup-v${version}-x64.${ext}
  deleteAppDataOnUninstall: false
  # Branded wizard artwork. Generated into the buildResources directory by
  # scripts/generate-nsis-bitmaps.cjs on every build (24-bit BMP, the only
  # format NSIS can render). Paths are relative to directories.buildResources.
  installerHeader: installerHeader.bmp
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: uninstallerSidebar.bmp
  # Show the wizard in Chinese unless the user (or an en-US system) picks
  # English explicitly; without this the stock wizard is English-only.
  displayLanguageSelector: true
  installerLanguages:
    - zh_CN
    - en_US
  include: electron/installer.nsh

electronLanguages:
  - zh-CN
  - en-US

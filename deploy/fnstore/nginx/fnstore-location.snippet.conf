# 片段：把 /fnstore/ 管理页反代到 Python 版旁路容器（5661）
#
# 这个片段不属于本部署包，需要手动加进"对外提供 :4001 的那个 server 块"里
# （当前是 new-api 的网关配置 /etc/nginx/conf.d/new-api-gateway.conf）。
# 直接把这个文件覆盖过去会连带改掉 new-api 的 :4001/:4002 站点，所以只提供片段。
#
# 加完后：
#   nginx -t && systemctl reload nginx
#   curl -o /dev/null -w '%{http_code}\n' http://fnapp.floatingice.win:4001/fnstore/

    # FN 软仓源管理（MMH）：必须指向 5661。
    # 5660 是官方 Go 版，没有 /fnstore 路由，指过去只会得到 404。
    location = /fnstore {
        return 301 /fnstore/;
    }
    location /fnstore/ {
        proxy_pass http://127.0.0.1:5661;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

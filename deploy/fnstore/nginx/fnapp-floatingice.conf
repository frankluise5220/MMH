# MMH 专属软件源：http://fnapp.floatingice.win/（FN 软仓客户端 / FnDepot 插件都从这里取）
#
# 按路径分流到两个后端
#   5660  Go 版 2.8.4      -> /api/apps（应用列表）、/api/rating/*（评分）、/admin、/health、/api/notice
#   5661  Python 版 2.2.0  -> /apps/*、/downloads/*（下载类）
#
# 为什么下载类必须走 5661
#   下载统计只能有一个写入方。Go 版把下载记进自己的 stats.db（只记 127.0.0.1，
#   也没有客户端/日期维度），Python 版记进统一的 data/mmh-stats.db。
#   把 /apps/ 与 /downloads/ 都交给 Python 版，才能保证"每次下载都被完整记录一次"。
#   这不会影响评分功能——评分走 /api/rating/*，仍在 5660。

server {
    listen 80;
    server_name fnapp.floatingice.win;

    client_max_body_size 500m;

    location /apps/ {
        proxy_pass http://127.0.0.1:5661;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /downloads/ {
        proxy_pass http://127.0.0.1:5661;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:5660;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}

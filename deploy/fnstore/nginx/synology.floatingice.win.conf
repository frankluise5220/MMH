# 群晖套件源：https://synology.floatingice.win
#
# 链路
#   DSM -> 443 (mmh-synology-sni-proxy, 按 SNI 分流) -> 127.0.0.1:9443 (本文件, TLS 终结)
#       -> 127.0.0.1:5661 (Python 版 fn-appstores-server, 即 app.py)
#
# 为什么是 5661 而不是 5660
#   5660 跑的是官方 Go 版 2.8.4，它没有实现群晖套件源协议（/ 与 /catalog.json）、
#   /downloads/、/fnstore 管理页，也没有 app.py 里那些 MMH 扩展。
#   2026-09-27 用它顶掉 5660 上的 Python 版之后，这三样一起坏了（见 docs/rating-failure-2026-09-28.md）。
#   现在 5660 保留 Go 版（评分接口靠它），5661 起 Python 版旁路补齐缺口。
#
# proxy_protocol 的必要性
#   SNI 代理是纯 TCP 转发，nginx 只跟 127.0.0.1 说话，$remote_addr 恒为 127.0.0.1，
#   于是群晖渠道的下载全被记成 127.0.0.1。SNI 代理已改为在转发前发 PROXY protocol v1 头，
#   这里必须用 `listen ... proxy_protocol` 接收，否则握手会失败。

server {
    listen 80;
    server_name synology.floatingice.win;

    location / {
        proxy_pass http://127.0.0.1:5661;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 500m;
    }
}

server {
    listen 127.0.0.1:9443 ssl proxy_protocol;
    server_name synology.floatingice.win;

    # PROXY protocol 里带的是真实客户端 IP；只信任本机来的 PROXY 头
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate /etc/nginx/certs/synology.floatingice.win/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/synology.floatingice.win/synology.floatingice.win.key;
    ssl_session_cache shared:SynologySSL:1m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:5661;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 500m;
    }
}

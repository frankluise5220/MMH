# MMH 私有 draft 镜像仓库的反代（registry:2 @ 127.0.0.1:5001）。
#
# 只挂在 fnapp.floatingice.win 的 443（SNI proxy -> 127.0.0.1:9445），复用该域名
# 已有的 Let's Encrypt 证书，所以拉取端**不需要**把地址写进 insecure-registries，
# 也不需要 docker login —— 匿名即可 pull。
#
# 与公开源的分工：
#   公开  fnapp.floatingice.win:5000/frankluise5220/mmh:<ver>|latest   匿名可拉
#   测试  fnapp.floatingice.win/draft/mmh:<ver>                        匿名可拉，公开前删除
# 两者是**独立 registry 实例 + 独立存储**（/opt/mmh-registry 与 /opt/mmh-draft-registry），
# 所以 draft 库的 catalog / tag 在公开库上完全看不到。
#
# 写入（push）只在本机做：/opt/mmh-draft-registry/sync-draft-image.sh 直接推
# 127.0.0.1:5001，不走 nginx，所以对外只暴露读能力。
#
# 不要把它做成 :5000 的同一实例加前缀——那样 /v2/_catalog 匿名就能列出 draft/*。
location /v2/ {
    auth_basic off;

    proxy_pass http://127.0.0.1:5001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # 镜像层动辄几十上百 MB，docker 走 chunked 上传，默认 128m 会 413。
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

# MMH 后台管理：https://admin.floatingice.win
#
# 链路
#   浏览器 -> 443 (mmh-synology-sni-proxy，按 SNI 分流)
#          -> 127.0.0.1:9444 (本文件，TLS 终结)
#          -> 127.0.0.1:8791 (mmh-admin 容器，network_mode: host)
#
# 为什么 TLS 不直接 listen 443
#   :443 被 SNI 分流器独占（它还要把别的 SNI 转给 xray）。所以这里跟群晖套件源
#   一样，只在回环上收 TLS，由分流器按 SNI 送过来。
#
# proxy_protocol 的必要性
#   分流器是纯 TCP 转发，nginx 只跟 127.0.0.1 说话，$remote_addr 恒为 127.0.0.1。
#   分流器会在转发前发 PROXY protocol v1 头（含真实客户端 IP），这里必须用
#   `listen ... proxy_protocol` 接收，否则握手直接失败。
#   真实 IP 会进审计日志，所以这条链路对后台管理尤其重要。

server {
    listen 80;
    server_name admin.floatingice.win;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:9444 ssl proxy_protocol;
    server_name admin.floatingice.win;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/nginx/certs/admin.floatingice.win/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/admin.floatingice.win/admin.floatingice.win.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:AdminSSL:1m;
    ssl_session_timeout 10m;

    # 后台管理不该被搜索引擎/别的站点引用
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 后台接口都是动态数据，别让中间层缓存
        proxy_buffering off;
    }
}

name: Sync FnDepot source

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_version:
        description: "Optional package version. Leave blank to use package.json version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync-fndepot:
    name: Backfill FnDepot V2 source metadata (sha256/size/updated_at)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 必须 checkout main（而非触发 release 的 tag）：本 workflow 要往 main
          # 回填 fnpack.json 元数据。若 checkout 到 tag（detached HEAD），末尾
          # `git push HEAD:main` 会因 main 上已有 tag 之后的 commit 而 non-fast-forward
          # 被拒（2026-10-04 v0.1.70 发布时即因此失败，导致 FnDepot 源缺新版本条目）。
          # fetch-depth: 0 保证拿到全部 tag，供「Resolve release version」里的
          # `git tag -l` 校验使用。
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve release version and tag
        id: meta
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.package_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # 版本来源优先级：workflow_dispatch 输入 > release 事件的 tag_name > package.json。
          # 不能用 package.json 作唯一来源：checkout 到 main 时 package.json 可能已 bump 到
          # 更高版本，而本次要同步的是「刚发布的 release」对应的版本（= release tag）。
          if [ -n "${DISPATCH_VERSION}" ]; then
            version="${DISPATCH_VERSION#v}"
          elif [ -n "${RELEASE_TAG}" ]; then
            version="${RELEASE_TAG#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid package version: ${version}"
            exit 1
          fi
          tag="v${version}"
          if [ "$(git tag -l "$tag")" != "$tag" ]; then
            echo "::error::Tag ${tag} not found in this repository."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Wait for release FPK assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # fnos-release builds both arch FPKs for ~10-20 minutes after the
          # release is published; give the assets up to 30 minutes to appear.
          for attempt in $(seq 1 60); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
              --jq '[.assets[] | select(.name | endswith(".fpk"))] | length')"
            if [ "$count" -ge 2 ]; then
              echo "Found ${count} FPK assets for v${VERSION}."
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::FPK assets for v${VERSION} incomplete after 30 minutes (found ${count})."
              exit 1
            fi
            echo "Attempt ${attempt}/60: ${count}/2 FPK assets present, waiting..."
            sleep 30
          done

      - name: Reject dead release entries in the FnDepot source
        # --check 会对每个 release 条目查 GitHub Release；查不到的版本 = 死链
        # （FnDepot 下载时会报「Range 探测返回 HTTP 404」），必须先从源里删掉。
        # 放在回填之前，保证「源里有死链」时直接停住，不把回填结果提交上去。
        # 这一步不会误报：workflow 只在 release: published 触发，当前版本一定有 Release；
        # 手动 dispatch 但尚未发布的情况，上面的「Wait for release FPK assets」已经会先失败。
        run: node scripts/sync-fndepot-source.cjs --input deploy/fnos/repository/fnpack.json --check

      - name: Backfill sha256/size/updated_at into fnpack.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts/sync-fndepot-source.cjs --input deploy/fnos/repository/fnpack.json

      - name: Verify release metadata consistency
        run: npm run check:release-version

      - name: Commit backfilled source index
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/fnos/repository/fnpack.json
          if git diff --staged --quiet; then
            echo "fnpack.json unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(fnos): backfill FnDepot source metadata for ${{ steps.meta.outputs.tag }}"
          # 推送前 rebase 到远端 main 最新提交：即使本 workflow 运行期间有并发
          # 提交（如 release 流程同时改 main），也先把本地的回填 commit 挪到
          # main 最新 tip 之上再推，避免 non-fast-forward。checkout 已是 main 分支，
          # rebase 不会产生分叉。
          git pull --rebase origin main
          git push origin HEAD:main

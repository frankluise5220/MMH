name: Build fnOS SQLite Stage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fnos-stage.yml"
      - "scripts/build-fnos-*.cjs"
      - "scripts/generate-native-sqlite-schema.cjs"
      - "scripts/verify-fnos-package.cjs"
      - "prisma/schema.prisma"
      - "prisma/schema.native.prisma"
      - "src/**/*.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      package_version:
        description: "Optional package version. Leave blank to use package.json version."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-stage:
    name: Build Linux fnOS SQLite stage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Linux Node runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/fnos/runtime
          NODE_VERSION="$(node -p "process.versions.node")"
          NODE_TARBALL="node-v${NODE_VERSION}-linux-x64.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TARBALL}" \
            -o "release-artifacts/fnos/runtime/${NODE_TARBALL}"
          echo "FNOS_NODE_TARBALL=${PWD}/release-artifacts/fnos/runtime/${NODE_TARBALL}" >> "$GITHUB_ENV"

      - name: Build fnOS SQLite app
        env:
          DATABASE_URL: file:./native-build.db
          MMH_DEPLOY_TARGET: fnos
        run: npm run build:fnos:app

      - name: Build fnOS stage archive
        env:
          FNOS_PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package_version || '' }}
          FNOS_NODE_TARBALL: ${{ env.FNOS_NODE_TARBALL }}
        run: npm run stage:fnos

      - name: Verify fnOS package source
        run: npm run check:fnos

      - name: Upload fnOS stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmh-fnos-stage
          path: release-artifacts/fnos/mmh-*-fpk-source.tgz
          if-no-files-found: error

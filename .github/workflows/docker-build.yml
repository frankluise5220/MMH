name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags:
      - "v*"
  # Publishing the release (not pushing the tag) is what makes an image
  # pullable: v0.1.78 shipped `latest` + `0.1.78` from the tag push on
  # 2026-10-25 22:48, ~27 hours before the release was published, and the
  # commits in between had no HouseholdPreference.detailWindowYears. Every
  # Docker user who pulled in that window recorded schema_version=0.1.78
  # against a table missing the column, and the real 0.1.78 image then
  # skipped `prisma db push` (same version string) and served P2022
  # ColumnNotFound on every preference read (reported 2026-10-27).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "重发已发布版本（必须等于 package.json 的 version，例如 0.1.82），会同时推 latest 与该版本标签。留空则只产出 sha-<commit> 快照。"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The verification steps below run repository scripts, and check:backup
      # ends with a .ts harness that needs `tsx`. Without an install step the
      # runner has no node_modules and the job dies on `sh: 1: tsx: not found`
      # (first v0.1.78 attempt, 2026-10-26).
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # check:backup walks the generated Prisma client (models + relation graph)
      # instead of re-parsing schema.prisma, but `--ignore-scripts` skips Prisma's
      # postinstall generate, so the client must be produced explicitly or the job
      # dies on `Cannot find module '.prisma/client/default'` (2026-11-03).
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # 重发入口（2026-11-05 v0.1.82 事件）：release v0.1.82 的 git tag 指向
      # b15e8f68，那个 commit 的 docker-entrypoint.sh 缺 ensure_category_type_name_unique，
      # 升级库上 db push 会要求 --accept-data-loss 然后 exit 78。修复合在 main 之后
      # 重新 publish 那个 release 只会重新构建出坏镜像，所以用 dispatch + 版本号重发：
      # 从当前 ref 构建，标签仍然是那个已发布的版本号，latest 随之回到健康版本。
      # 约束：只允许重发 package.json 当前的版本号，避免把 0.1.83 的代码挂成 0.1.82。
      - name: Resolve republish tag
        id: republish
        shell: bash
        run: |
          TAG="${{ inputs.publish_tag }}"
          VERSION="${{ steps.package.outputs.version }}"
          if [ -z "$TAG" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::publish_tag=$TAG 与 package.json version=$VERSION 不一致；重发只允许当前版本号"
            exit 1
          fi
          # 只允许 main：workflow_dispatch 的 --ref 可以是任意分支，
          # 从中间分支构建并挂上已发布版本号正是 v0.1.78 事故的形态。
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::重发只能从 main 构建（当前 $GITHUB_REF）"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "republishing $TAG from $(git rev-parse --short HEAD)"

      - name: Verify Docker entrypoint
        run: npm run check:docker

      # Fails the build when a household-scoped model in prisma/schema.prisma is
      # not wired into src/lib/server/backup.ts. Without this, adding a table and
      # forgetting backup.ts silently drops that data from every export and can
      # break restores with dangling foreign keys (the bond/reimbursement gaps).
      - name: Verify backup coverage
        run: npm run check:backup

      # Tag ownership rules:
      # - ONLY `release: published` writes `latest` and the plain version tag
      #   (0.1.x). A draft may be tagged and built for days before the user
      #   confirms it; those builds must not be pullable by name, or users
      #   upgrade to an intermediate commit whose schema is not the shipped one
      #   (v0.1.78, 2026-10-27 incident).
      # - v* tag pushes are pre-release snapshots: `sha-<commit>` only.
      # - Main-branch pushes are development snapshots: `main` + `sha-<commit>`,
      #   never `latest` (production web updaters track it) and never a
      #   package.json version tag (main's version does not bump per release,
      #   so it would clobber historical release images).
      - name: Compute app image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mmh
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' || steps.republish.outputs.enabled == 'true' }}
            type=raw,value=${{ steps.republish.outputs.tag }},enable=${{ steps.republish.outputs.enabled == 'true' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && endsWith(github.ref, '/heads/main') }}
            type=sha,prefix=sha-,format=short

      # The prisma runtime layer is 190 MB uncompressed (50.65 MB compressed).
      # An empty PRISMA_CLI_VERSION makes `prisma@` resolve to `latest`, which
      # changed the layer on every build: users re-downloaded 50.65 MB on every
      # upgrade and blew the mirror's per-layer timeout (2026-11-06). Pin the
      # exact versions from the lockfile; fall back to node_modules for the
      # republish path where the dependency tree may not be installed yet.
      - name: Resolve Prisma runtime versions
        id: prisma-runtime
        run: |
          cli="$(node -e "console.log(require('./package-lock.json').packages['node_modules/prisma'].version)" 2>/dev/null || true)"
          dotenv="$(node -e "console.log(require('./package-lock.json').packages['node_modules/dotenv'].version)" 2>/dev/null || true)"
          [ -n "$cli" ] || cli="$(node -e "console.log(require('./node_modules/prisma/package.json').version)")"
          [ -n "$dotenv" ] || dotenv="$(node -e "console.log(require('./node_modules/dotenv/package.json').version)")"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "dotenv=$dotenv" >> "$GITHUB_OUTPUT"
          echo "prisma runtime: prisma=$cli dotenv=$dotenv"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PRISMA_CLI_VERSION=${{ steps.prisma-runtime.outputs.cli }}
            DOTENV_VERSION=${{ steps.prisma-runtime.outputs.dotenv }}
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_MESSAGE=${{ github.event.head_commit.message }}
            APP_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
            APP_VERSION=${{ steps.package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute updater image tags
        id: meta-updater
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mmh-updater
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' || steps.republish.outputs.enabled == 'true' }}
            type=raw,value=${{ steps.republish.outputs.tag }},enable=${{ steps.republish.outputs.enabled == 'true' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && endsWith(github.ref, '/heads/main') }}
            type=sha,prefix=sha-,format=short

      - name: Build and push updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.updater
          push: true
          tags: ${{ steps.meta-updater.outputs.tags }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_COMMIT_MESSAGE=${{ github.event.head_commit.message }}
            APP_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
            APP_VERSION=${{ steps.package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 层体积门禁（2026-11-06，0.1.82 升级卡死事故）。
      # 国内镜像站按**单个 blob** 断线：约 10–12 MB 以上的层会下到 100% 后校验失败，
      # 然后无限重试同一层。所以「镜像构建成功」不等于「用户能升级」：0.1.82 的
      # mmh-updater 里有一层 24.31 MB（apk add git nodejs），导致所有存量 0.1.81 用户
      # 的「一键更新」永久卡在「拉取镜像」。
      # 判定口径是**差集**而不是绝对值：基础镜像层（node:20-bookworm 的 201.75 MB、
      # docker:28-cli 的 20.74 MB …）在存量用户本地已经存在，按 blob digest 直接跳过，
      # 用绝对值判会把 app 镜像永久判红。所以拿「用户正在跑的版本」当基线，
      # 只要求本次新增/变更的每一层 ≤ 10 MB（实测 12.89 MB 能过、14.25 MB 必卡）。
      # 红的时候 latest 已经指向坏镜像，必须立刻用 .github/workflows/retag.yml 把
      # latest 指回上一个健康的 digest，再修 Dockerfile。
      - name: Verify image layer sizes
        shell: bash
        env:
          MMH_IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          app_tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed -n '1p' | sed 's|.*:||')"
          updater_tag="$(printf '%s\n' "${{ steps.meta-updater.outputs.tags }}" | sed -n '1p' | sed 's|.*:||')"
          # 基线 = 现存的最新发布 tag（排除正在构建的这一版）。checkout 是浅克隆，
          # 本地没有 tag，用 ls-remote 从远端拿。
          baseline="$(git ls-remote --tags --refs origin 'v*' 2>/dev/null \
            | sed 's|.*refs/tags/v||' | grep -vx "$app_tag" | sort -V | tail -1 || true)"
          echo "审计 mmh:${app_tag} 与 mmh-updater:${updater_tag}；基线=${baseline:-无}"
          since_args=()
          if [ -n "$baseline" ]; then
            since_args=(--since "$baseline")
          else
            echo "没有可对比的发布 tag：只输出全量报告，不判定（首次发版）"
          fi
          node scripts/check-image-layer-sizes.mjs --repo mmh --tag "$app_tag" "${since_args[@]}"
          node scripts/check-image-layer-sizes.mjs --repo mmh-updater --tag "$updater_tag" "${since_args[@]}"
          if [ -z "$baseline" ]; then
            exit 0
          fi
          if [ "${{ steps.republish.outputs.enabled }}" = "true" ] || [ "${{ github.event_name }}" = "release" ]; then
            node scripts/check-image-layer-sizes.mjs --repo mmh --tag latest "${since_args[@]}"
            node scripts/check-image-layer-sizes.mjs --repo mmh-updater --tag latest "${since_args[@]}"
          fi

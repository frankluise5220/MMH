name: Release fnOS SQLite FPK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package_version:
        description: "fnOS FPK package version"
        required: false
        default: "0.1.0-fnos"

permissions:
  contents: write

jobs:
  build-fpk:
    name: Build and upload fnOS SQLite FPK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify fnOS package sources
        run: npm run check:fnos

      - name: Check existing Release FPK
        id: existing-fpk
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_URL: ${{ github.event.release.assets_url }}
        run: |
          set -euo pipefail
          FOUND="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${ASSETS_URL}" |
            node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const a=JSON.parse(s);console.log(a.some(x=>x.name==='mmh.fpk'||/^mmh-.+\\.fpk$/.test(String(x.name||'')))?'true':'false')})"
          )"
          echo "found=${FOUND}" >> "$GITHUB_OUTPUT"

      - name: Verify fnpack
        if: github.event_name != 'release' || steps.existing-fpk.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v fnpack >/dev/null 2>&1; then
            echo "::error::fnpack was not found. Install fnpack on the release runner before publishing fnOS .fpk assets."
            echo "::error::Do not upload release-artifacts/fnos/*-fpk-source.tgz as a user package; only .fpk is valid for release."
            exit 1
          fi

      - name: Download Linux Node runtime
        if: github.event_name != 'release' || steps.existing-fpk.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/fnos/runtime
          NODE_VERSION="$(node -p "process.versions.node")"
          NODE_TARBALL="node-v${NODE_VERSION}-linux-x64.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TARBALL}" \
            -o "release-artifacts/fnos/runtime/${NODE_TARBALL}"
          echo "FNOS_NODE_TARBALL=${PWD}/release-artifacts/fnos/runtime/${NODE_TARBALL}" >> "$GITHUB_ENV"

      - name: Build fnOS SQLite app
        if: github.event_name != 'release' || steps.existing-fpk.outputs.found != 'true'
        env:
          DATABASE_URL: file:./native-build.db
          MMH_DEPLOY_TARGET: fnos
        run: npm run build:fnos:app

      - name: Build fnOS FPK
        if: github.event_name != 'release' || steps.existing-fpk.outputs.found != 'true'
        env:
          FNOS_PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package_version || github.event.release.tag_name || '' }}
          FNOS_NODE_TARBALL: ${{ env.FNOS_NODE_TARBALL }}
        run: npm run build:fnos

      - name: Upload fnOS FPK artifact
        if: github.event_name != 'release' || steps.existing-fpk.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mmh-fnos-fpk
          path: release-artifacts/fnos/*.fpk
          if-no-files-found: error

      - name: Upload fnOS FPK to GitHub Release
        if: github.event_name == 'release' && steps.existing-fpk.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/fnos/*.fpk

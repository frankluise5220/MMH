name: Release fnOS FPK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fpk:
    name: Build and upload fnOS FPK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify fnOS package sources
        run: npm run check:fnos

      - name: Verify fnpack
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v fnpack >/dev/null 2>&1; then
            echo "::error::fnpack was not found. Install fnpack on the release runner before publishing fnOS .fpk assets."
            echo "::error::Do not upload release-artifacts/fnos/*-fpk-source.tgz as a user package; only .fpk is valid for release."
            exit 1
          fi

      - name: Build fnOS FPK
        run: npm run build:fnos

      - name: Upload fnOS FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mmh-fnos-fpk
          path: release-artifacts/fnos/*.fpk
          if-no-files-found: error

      - name: Upload fnOS FPK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/fnos/*.fpk
